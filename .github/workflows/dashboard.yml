name: dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yml
      - docs/index.html
      - docs/detail.html
      - scripts/**
      - .github/workflows/dashboard.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    # For the company: set repo variable RUNNER_LABEL=self-hosted (GitHub-hosted if empty)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      DB_DSN: ${{ secrets.DB_DSN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Demo DB (when the DB_DSN secret is not set)
        if: env.DB_DSN == ''
        run: .venv/bin/python scripts/demo_db.py

      - name: Smoke tests
        run: .venv/bin/python scripts/smoke_test.py

      - name: Poll
        run: .venv/bin/python scripts/poll.py

      - name: Commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A docs/data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
